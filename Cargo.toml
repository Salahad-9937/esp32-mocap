[package]
name = "mocap-app"
version = "0.2.0"
edition = "2021"
authors = ["Salahad"]
description = "ESP32 IMU MoCap System reference UI and telemetry receiver"

[workspace]
members = [
    ".",
    "crates/mocap-core",
    "tools/mocap-context",
]
resolver = "2"

[dependencies]
mocap-core = { path = "crates/mocap-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serialport = "4.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"